<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75"/>
    </linearGradient>

    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    .bg-shape {
      animation: floatPulse 10s ease-in-out infinite alternate;
    }
    .pulse-glow {
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }
    .stream-line {
      stroke-dasharray: 8 16;
      animation: dashMove 14s linear infinite;
    }
    .stream-line-rev {
      stroke-dasharray: 6 12;
      animation: dashMoveRev 12s linear infinite;
    }
    .float-card-1 {
      animation: floatSlow 7s ease-in-out infinite alternate;
    }
    .float-card-2 {
      animation: floatSlowAlt 8s ease-in-out infinite alternate;
    }
    .float-card-3 {
      animation: floatSlow 9s ease-in-out infinite alternate;
    }
    .pulse-pill {
      animation: pillFade 4s ease-in-out infinite alternate;
    }

    @keyframes dashMove {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -240; }
    }
    @keyframes dashMoveRev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 240; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.25; transform: scale(0.95); }
      100% { opacity: 0.55; transform: scale(1.05); }
    }
    @keyframes floatPulse {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(2deg); }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes floatSlowAlt {
      0% { transform: translateY(0px); }
      100% { transform: translateY(10px); }
    }
    @keyframes pillFade {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="80" r="140" fill="#6366f1" filter="url(#blurGlow)" class="pulse-glow" />
  <circle cx="1020" cy="280" r="160" fill="#06b6d4" filter="url(#blurGlow)" class="pulse-glow" style="animation-delay: -3s;" />
  <circle cx="950" cy="70" r="120" fill="#a855f7" filter="url(#blurGlow)" class="pulse-glow" style="animation-delay: -5s;" />

  <!-- Dynamic Circuit / Connection Lines in Background -->
  <g opacity="0.35">
    <path d="M 50 180 C 250 120, 350 260, 600 180 C 850 100, 950 240, 1150 180" fill="none" stroke="#38bdf8" stroke-width="2" class="stream-line" />
    <path d="M 80 80 C 300 160, 400 40, 650 120 C 900 200, 1000 80, 1120 120" fill="none" stroke="#a855f7" stroke-width="1.5" class="stream-line-rev" />
    <path d="M 120 280 C 320 220, 480 320, 720 260 C 960 200, 1050 300, 1150 240" fill="none" stroke="#818cf8" stroke-width="1.5" class="stream-line" />
  </g>

  <!-- Animated Floating Glass Cards (Left & Right decorative accents) -->
  <!-- Left Side: Mini UI Component Card -->
  <g class="float-card-1" opacity="0.85">
    <rect x="55" y="85" width="165" height="110" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" filter="url(#softShadow)"/>
    <circle cx="75" cy="105" r="5" fill="#f43f5e"/>
    <circle cx="90" cy="105" r="5" fill="#eab308"/>
    <circle cx="105" cy="105" r="5" fill="#10b981"/>
    <rect x="75" y="125" width="85" height="10" rx="3" fill="#38bdf8" fill-opacity="0.6"/>
    <rect x="75" y="145" width="125" height="8" rx="2" fill="#64748b" fill-opacity="0.4"/>
    <rect x="75" y="160" width="105" height="8" rx="2" fill="#64748b" fill-opacity="0.4"/>
    <rect x="75" y="175" width="60" height="8" rx="2" fill="#818cf8" fill-opacity="0.6"/>
  </g>

  <!-- Left Side: Component Chip -->
  <g class="float-card-2" opacity="0.85">
    <rect x="85" y="225" width="145" height="50" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" filter="url(#softShadow)"/>
    <rect x="100" y="243" width="14" height="14" rx="3" fill="#38bdf8"/>
    <text x="122" y="254" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">&lt;EmbedUI /&gt;</text>
  </g>

  <!-- Right Side: Analytics Mini Chart Card -->
  <g class="float-card-2" opacity="0.85">
    <rect x="980" y="70" width="170" height="115" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" filter="url(#softShadow)"/>
    <text x="1000" y="94" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">LIVE TELEMETRY</text>
    <!-- Bar charts -->
    <rect x="1000" y="145" width="14" height="25" rx="2" fill="#6366f1"/>
    <rect x="1022" y="130" width="14" height="40" rx="2" fill="#818cf8"/>
    <rect x="1044" y="115" width="14" height="55" rx="2" fill="#38bdf8"/>
    <rect x="1066" y="135" width="14" height="35" rx="2" fill="#a855f7"/>
    <rect x="1088" y="110" width="14" height="60" rx="2" fill="#c084fc"/>
    <rect x="1110" y="125" width="14" height="45" rx="2" fill="#38bdf8"/>
  </g>

  <!-- Right Side: SDK Badge Card -->
  <g class="float-card-3" opacity="0.85">
    <rect x="965" y="215" width="175" height="55" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" filter="url(#softShadow)"/>
    <circle cx="988" cy="242" r="7" fill="#10b981" fill-opacity="0.8" />
    <circle cx="988" cy="242" r="11" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
    <text x="1008" y="240" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">MODULAR SDK</text>
    <text x="1008" y="254" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Zero-Lockin Architecture</text>
  </g>

  <!-- Central Foreground Content (Title, Badges, Subtitle) -->
  <!-- Top Category Badge Pill -->
  <g class="pulse-pill" transform="translate(600, 75)">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e293b" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="-148" cy="0" r="5" fill="#38bdf8"/>
    <text x="0" y="4" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="150" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1.2">Awesome Embedded UI Components</text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" letter-spacing="-0.2">Frameworks, Low-Code SDKs &amp; Embeddable App Builders</text>

  <!-- Secondary Meta Tagline -->
  <text x="600" y="232" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">Enterprise SaaS Leaders • Battle-Tested Open Source • Developer Dashboards</text>

  <!-- Interactive Tag Pills / Badges along bottom center -->
  <g transform="translate(600, 280)">
    <!-- Pill 1: Embeddable SDKs -->
    <g transform="translate(-240, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="0" y="4.5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">⚡ Embed SDKs</text>
    </g>
    <!-- Pill 2: Open Source -->
    <g transform="translate(-75, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="0" y="4.5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">⭐ Open Source</text>
    </g>
    <!-- Pill 3: Low-Code & BI -->
    <g transform="translate(80, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="0" y="4.5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">📊 BI &amp; Analytics</text>
    </g>
    <!-- Pill 4: Headless Admin -->
    <g transform="translate(235, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="0" y="4.5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">🛠️ Headless UI</text>
    </g>
  </g>
</svg>
