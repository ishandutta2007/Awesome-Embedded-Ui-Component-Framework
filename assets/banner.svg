 alternate}.float-card-3{animation:floatSlow 9s ease-in-out infinite alternate}.pulse-pill{animation:pillFade 4s ease-in-out infinite alternate}</style><rect width="100%" height="100%" fill="url(#bgGradient)"/><rect width="100%" height="100%" fill="url(#grid)"/><circle cx="200" cy="80" r="140" fill="#6366f1" class="pulse-glow" filter="url(#blurGlow)"/><circle cx="1020" cy="280" r="160" fill="#06b6d4" class="pulse-glow" filter="url(#blurGlow)" style="animation-delay:-3s"/><circle cx="950" cy="70" r="120" fill="#a855f7" class="pulse-glow" filter="url(#blurGlow)" style="animation-delay:-5s"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 180 C 250 120, 350 260, 600 180 C 850 100, 950 240, 1150 180" class="stream-line"/><path fill="none" stroke="#a855f7" stroke-width="1.5" d="M 80 80 C 300 160, 400 40, 650 120 C 900 200, 1000 80, 1120 120" class="stream-line-rev"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M 120 280 C 320 220, 480 320, 720 260 C 960 200, 1050 300, 1150 240" class="stream-line"/></g><g class="float-card-1" opacity=".85"><rect width="165" height="110" x="55" y="85" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" filter="url(#softShadow)" rx="12"/><circle cx="75" cy="105" r="5" fill="#f43f5e"/><circle cx="90" cy="105" r="5" fill="#eab308"/><circle cx="105" cy="105" r="5" fill="#10b981"/><rect width="85" height="10" x="75" y="125" fill="#38bdf8" fill-opacity=".6" rx="3"/><rect width="125" height="8" x="75" y="145" fill="#64748b" fill-opacity=".4" rx="2"/><rect width="105" height="8" x="75" y="160" fill="#64748b" fill-opacity=".4" rx="2"/><rect width="60" height="8" x="75" y="175" fill="#818cf8" fill-opacity=".6" rx="2"/></g><g class="float-card-2" opacity=".85"><rect width="145" height="50" x="85" y="225" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity=".4" stroke-width="1" filter="url(#softShadow)" rx="10"/><rect width="14" height="14" x="100" y="243" fill="#38bdf8" rx="3"/><text